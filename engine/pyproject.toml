[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sast-engine"
version = "1.0.0"
description = "Motor SAST: parsing AST/Tree-sitter, regras deterministicas, taint analysis e triagem com LLM local"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
js = ["tree-sitter>=0.23", "tree-sitter-javascript>=0.23", "tree-sitter-java>=0.23"]
tools = ["bandit>=1.7.9"]
pdf = ["reportlab>=4.2"]
dev = ["pytest>=8", "pytest-cov>=5"]

[project.scripts]
sast = "sast_engine.cli:main"

[tool.setuptools.packages.find]
include = ["sast_engine*"]

[tool.setuptools.package-data]
sast_engine = ["semgrep_rules/*.yml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
