name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  engine:
    name: Motor SAST - testes e benchmark
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e "engine[js,tools,dev]" ruff
      - name: Lint (ruff)
        run: ruff check engine services
      - name: Testes unitarios
        run: pytest engine/tests --cov=sast_engine --cov-report=term-missing --cov-fail-under=80
      - name: Benchmark de precisao (TP/FP/FN)
        run: |
          sast benchmark samples -o benchmark.md
          cat benchmark.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: benchmark
          path: benchmark.md

  api:
    name: API - testes de integracao
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r services/api/requirements.txt pytest ./engine
      - run: pytest
        working-directory: services/api

  dashboard:
    name: Dashboard - build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: npm ci
        working-directory: dashboard
      - run: npm run build
        working-directory: dashboard

  docker:
    name: Docker - build das imagens
    runs-on: ubuntu-latest
    needs: [engine, api, dashboard]
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: POSTGRES_PASSWORD=ci docker compose build api dashboard
      - name: Build da imagem de deploy (Render, contêiner único)
        run: |
          docker build -f Dockerfile.deploy -t sast-sentinel:deploy .
          docker run -d --name deploy -p 8100:8000 sast-sentinel:deploy
          for i in $(seq 1 30); do curl -fs localhost:8100/api/health && break; sleep 2; done
          curl -fs localhost:8100/ | grep -q "<div id=\"root\">"
          docker rm -f deploy
      - name: Smoke test da stack
        run: |
          export POSTGRES_PASSWORD=ci AI_ENABLED_DEFAULT=false
          docker compose up -d postgres redis api worker
          for i in $(seq 1 30); do curl -fs localhost:8000/api/health && break; sleep 2; done
          curl -fs localhost:8000/api/health
          docker compose logs api | tail -20
          docker compose down -v
