server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 60m;

    # DNS interno do Docker: re-resolve "api" a cada 10s (o IP muda quando o contêiner é recriado)
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_upstream http://api:8000;
    server_tokens off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; connect-src 'self'" always;

    location /api/ {
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location /docs { proxy_pass $api_upstream; }
    location /openapi.json { proxy_pass $api_upstream; }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
